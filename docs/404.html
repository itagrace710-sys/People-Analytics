    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Automatically ensure relative assets resolve accurately on GitHub Pages subpaths
      (function() {
        var base = document.createElement('base');
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          path = path + '/';
        }
        base.href = window.location.origin + path;
        document.head.prepend(base);
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CqlUp-IJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Ce2dsdcN.css">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white font-sans">
    <div id="root">
      <div id="pas-loader" style="min-height: 100vh; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: pas-spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 16px; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em;">People Analytics Studio</div>
        <div style="font-size: 12px; color: #94a3b8; margin-top: 6px;">Loading HR Intelligence Platform...</div>
        <div id="pas-timeout-notice" style="display: none; margin-top: 16px; padding: 10px 16px; border-radius: 8px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(100, 116, 139, 0.4); max-width: 380px;">
          <p style="font-size: 11px; color: #cbd5e1; margin: 0 0 8px 0;">If loading takes more than a few seconds, refresh or verify GitHub Pages deployment settings.</p>
          <button onclick="window.location.reload()" style="background: #4f46e5; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;">Refresh App</button>
        </div>
        <style>@keyframes pas-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var notice = document.getElementById('pas-timeout-notice');
        if (notice && document.getElementById('pas-loader')) {
          notice.style.display = 'block';
        }
      }, 6000);
    </script>
  </body>
</html>
